<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Contractzy POC</title>

    <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>

    <style>
        #selectedText {
            border: 1px solid #999;
            max-height: 160px;
            overflow-y: auto;
            padding: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h2>Contractzy POC</h2>

    <p>Plugin is running!</p>

    <p>
        <strong>Contractzy Contract ID:</strong>
        <span id="contractId">Not received</span>
    </p>

    <button id="insertBtn">
        Insert Hello
    </button>

    <button id="getSelectedTextBtn">
        Get Selected Text
    </button>

    <button id="inspectSelectionBtn">
        Inspect Selection
    </button>

    <pre id="selectionInfo">Selection information will appear here.</pre>

    <h3>Selected Contract Content Preview</h3>

    <div id="selectedText">Nothing selected</div>

    <script>
        let contractId = null;
        let latestSelectedText = "";
        let handlersInitialized = false;

        // Expected host message: { type: "contractzyContext", contractId: "..." }
        window.Asc.plugin.onExternalPluginMessage = function (data) {
            if (!data || data.type !== "contractzyContext") {
                return;
            }

            if (typeof data.contractId !== "string" || !data.contractId.trim()) {
                return;
            }

            contractId = data.contractId.trim();
            document.getElementById("contractId").textContent = contractId;
            console.log("Contractzy context received", {
                contractId: contractId
            });
        };

        window.Asc.plugin.init = function (text) {

            console.log("Contractzy POC initialized");

            latestSelectedText = text || "";

            if (handlersInitialized) {
                return;
            }

            handlersInitialized = true;

            document.getElementById("insertBtn").addEventListener("click", function () {

                console.log("Insert Hello clicked");

                window.Asc.plugin.executeMethod(
                    "PasteText",
                    ["Hello from Contractzy Plugin!"]
                );

            });

            document.getElementById("getSelectedTextBtn").addEventListener("click", function () {

                window.Asc.plugin.executeMethod(
                    "GetSelectedText",
                    [{
                        "Numbering": false,
                        "Math": false,
                        "TableCellSeparator": "\n",
                        "ParaSeparator": "\n",
                        "TabSymbol": "\t"
                    }],
                    function (text) {

                        const selectedText = text || latestSelectedText || "Nothing selected";

                        console.log("Selected text:", selectedText);
                        document.getElementById("selectedText").textContent = selectedText;

                    }
                );

            });

            document.getElementById("inspectSelectionBtn").addEventListener("click", function () {

                window.Asc.plugin.executeMethod(
                    "GetSelectionType",
                    [],
                    function (selectionType) {

                        const selectedText = latestSelectedText || "";
                        const selectionInfo = [
                            "Editor type: " + window.Asc.plugin.info.editorType,
                            "Selection type: " + selectionType,
                            "Selected text length: " + selectedText.length
                        ].join("\n");

                        console.log("Selection inspection:", {
                            editorType: window.Asc.plugin.info.editorType,
                            selectionType: selectionType,
                            selectedTextLength: selectedText.length
                        });
                        document.getElementById("selectionInfo").textContent = selectionInfo;

                    }
                );

            });
        };

        window.Asc.plugin.button = function (id) {
            if (id === -1) {
                window.Asc.plugin.executeCommand("close", "");
            }
        };
    </script>

</body>

</html>
