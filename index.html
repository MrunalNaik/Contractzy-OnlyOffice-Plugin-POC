<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Contractzy POC</title>

    <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
</head>

<body>

    <h2>Contractzy POC</h2>

    <p>Plugin is running!</p>

    <button id="insertBtn">
        Insert Hello
    </button>

    <button id="getSelectedTextBtn">
        Get Selected Text
    </button>

    <p id="selectedText">Nothing selected</p>

    <script>
        window.Asc.plugin.init = function () {

            console.log("Contractzy POC initialized");

            document
                .getElementById("insertBtn")
                .addEventListener("click", function () {

                    console.log("Insert Hello clicked");

                    window.Asc.plugin.executeMethod(
                        "PasteText",
                        ["Hello from Contractzy Plugin!"]
                    );

                });

            document
                .getElementById("getSelectedTextBtn")
                .addEventListener("click", function () {

                    window.Asc.plugin.executeMethod(
                        "GetSelectedText",
                        [{
                            "Numbering": false,
                            "Math": false,
                            "TableCellSeparator": "\n",
                            "ParaSeparator": "\n",
                            "TabSymbol": "\t"
                        }],
                        function (text) {

                            const selectedText = text || "Nothing selected";

                            console.log("Selected text:", selectedText);
                            document.getElementById("selectedText").textContent = selectedText;

                        }
                    );

                });
        };

        window.Asc.plugin.button = function (id) {
            console.log("Button clicked:", id);
        };
    </script>

</body>

</html>
