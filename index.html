<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Contractzy POC</title>

    <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
</head>

<body>

    <h2>Contractzy POC</h2>

    <p>Plugin is running!</p>

    <button id="insertBtn">
        Insert Hello
    </button>

    <script>
        window.Asc.plugin.init = function () {

            console.log("Contractzy POC initialized");

            document
                .getElementById("insertBtn")
                .addEventListener("click", function () {

                    console.log("Insert Hello clicked");

                    window.Asc.plugin.executeMethod(
                        "PasteText",
                        ["Hello from Contractzy Plugin!"]
                    );

                });
        };
    </script>

</body>

</html>
